[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://bellatorrpg.online/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/album.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
