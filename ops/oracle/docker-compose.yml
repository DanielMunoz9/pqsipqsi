services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PORT: 8080
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_HOST: ${PUBLIC_HOST:-bellatorrpg.online}
    expose:
      - "8080"

  caddy:
    image: caddy:2.9
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-bellatorrpg.online}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: